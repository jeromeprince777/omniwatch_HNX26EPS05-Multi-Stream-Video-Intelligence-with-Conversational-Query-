[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniwatch"
version = "0.1.0"
description = "Multi-Stream Video Intelligence with Conversational Query (HNX26EPS05)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function calls in default arguments (common in FastAPI/Pydantic)
]

[tool.ruff.lint.isort]
known-first-party = ["omniwatch"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
